[project]
name = "ashby-mcp"
version = "1.1.0"
description = "Connect Ashby to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Ashby API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["ashby", "ashby api", "ashby mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/ashby-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=ashby"
Source = "https://github.com/cotlet-connect/ashby-mcp"

[project.scripts]
ashby-mcp = "ashby_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"ashby_agent.py" = "ashby_agent.py"

[tool.hatch.build.targets.sdist]
include = ["ashby_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
